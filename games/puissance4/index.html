// ══════════════════ Chargement (DA GameHub) ══════════════════
const wait = ms => new Promise(r => setTimeout(r, ms));
// Le jeu ne se montre qu'une fois polices, photo de la salle, plateau 3D et connexion prêts.
// Une étape qui traîne (réseau lent, WebGL absent) est abandonnée au bout de 8 s : on
// continue avec ce qu'on a (repli 2D, polices système), l'écran ne reste jamais bloqué.
const loading = (() => {
  const steps = [
    ['Polices', Promise.all([document.fonts.load('600 32px Cinzel'), document.fonts.load("16px 'Tenor Sans'")])],
    ['La salle', photoReady],
    ['Le plateau', gl3dReady],
    ['Connexion', ensureAuth()],
  ];
  const bar = $('loader-bar'), step = $('loader-step');
  let done = 0;
  const shown = wait(700);                                   // jamais un clignotement
  return Promise.all([shown, ...steps.map(([name, p]) => Promise.race([Promise.resolve(p).catch(() => {}), wait(8000)]).then(() => {
    done++;
    bar.style.transform = `scaleX(${Math.max(.04, done / steps.length)})`;
    step.textContent = `Chargement : ${Math.round(done / steps.length * 100)} %`;
    $('loader-die').style.left = `${Math.max(3, done / steps.length * 100)}%`;
  }))]).then(() => wait(280)).then(() => {
    const l = $('loader');
    l.classList.add('done');
    setTimeout(() => l.remove(), 600);
  });
})();

// ══════════════════ Ouverture (une fois par visite) ══════════════════
// La salle sort du noir, la photo se resserre, quatre pions tombent en diagonale, le fil les
// relie, puis le logotype et le menu arrivent. Un clic ou une touche termine tout de suite.
async function intro() {
  const html = document.documentElement;
  if (!html.classList.contains('intro')) return;
  try { sessionStorage.setItem('p4-intro', '1'); } catch (_) {}
  introRunning = true;
  const veil = $('intro-veil');
  veil.style.display = 'block';
  const items = [...$('s-home').children];
  const anims = [];
  let skipped = false;
  const skip = () => { skipped = true; anims.forEach(a => a.finish()); };
  addEventListener('pointerdown', skip, { once: true });
  addEventListener('keydown', skip, { once: true });
  for (let t = 0; !glDemo && t < 1600 && !skipped; t += 60) await wait(60);   // la 3D, si elle arrive
  const supports = DEMO.map((row, r) => [...row].map((v, c) => DEMO_WIN.some(([wr, wc]) => wr === r && wc === c) ? 0 : Number(v) || 0));
  glDemo?.clearEnd();
  glDemo?.setBoard(supports);
  anims.push(veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1200, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }));
  anims.push(photo.animate([{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 2800, easing: 'cubic-bezier(.22,1,.36,1)' }));
  items.forEach((el, i) => anims.push(el.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
    { duration: 700, delay: 1300 + i * 90, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' })));
  html.classList.remove('intro');                  // les animations tiennent le relais (fill: backwards)
  if (glDemo && !skipped) {
    await wait(650);
    for (const [r, c] of [...DEMO_WIN].sort((a, b) => a[1] - b[1])) {
      if (skipped) break;
      glDemo.drop(r, c, 1);
      await wait(260);
    }
    if (!skipped) await wait(420);
  }
  introRunning = false;
  paintDemo(document.body.dataset.screen === 's-lobby');       // l'écran a pu changer entre-temps
  await Promise.all(anims.map(a => a.finished.catch(() => {})));
  veil.style.display = '';
}

(function init() {
  const name = store.get(NAME);
  if (name) { $('create-name').value = name; $('join-name').value = name; }
  renderResume();
  show('s-home');
  const qs0 = (new URLSearchParams(location.search).get('code') || '');
  if (!qs0) loading.then(intro); else document.documentElement.classList.remove('intro');
  const qs = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  if (CODE_RE.test(qs)) {
    $('join-code').value = qs;
    if (store.get(SESSION)?.code === qs) { window.resumeGame(); return; }
    show('s-join');
    (name ? $('join-go') : $('join-name')).focus();
  }
})();
</script>
