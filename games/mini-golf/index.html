<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roulia — maintenance</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{--bg:#14432f;--card:#f4ecd8;--ink:#1b2420;--muted:#5a6159;--brass:#b08a3e;}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  main{max-width:440px;width:100%;padding:2.2rem 1.8rem;text-align:center;background:var(--card);
    border:2px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);}
  img{width:56px;height:56px;margin-bottom:1rem}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.7rem;line-height:1.2;margin-bottom:.8rem}
  p{line-height:1.5;color:var(--muted)}
  p+p{margin-top:.6rem}
  hr{border:0;border-top:2px solid var(--brass);width:48px;margin:1.2rem auto}
</style>
</head>
<body>
<main>
  <img src="/icons/favicon.svg" alt="">
  <h1>Site en maintenance</h1>
  <p>Roulia est momentanément indisponible le temps d'une opération de maintenance.</p>
  <hr>
  <p>Les jeux reviennent très vite. Merci de votre patience !</p>
</main>
</body>
</html>
