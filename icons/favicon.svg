  <rect class="trim" x="2.8" y="2.4" width="26.4" height="26.4" rx="8.2"/>
  <circle class="p" cx="9.6" cy="8.6" r="3"/>
  <circle cx="16" cy="15.6" r="3.4" fill="#FF5A3C"/>
