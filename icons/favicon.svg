<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon du hub : un de champagne en relief sur la tuile sombre du site.
       Le troisieme point est attenue, comme le point de « GAME.HUB ». -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ebcd"/>
      <stop offset="1" stop-color="#dcc48a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#07090f"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#e8d5a3" stroke-opacity=".22" stroke-width="2"/>
  <g transform="rotate(-11 32 32)">
    <rect x="13" y="16" width="38" height="38" rx="9.5" fill="#8f7a45"/>
    <rect x="13" y="12" width="38" height="38" rx="9.5" fill="url(#face)"/>
    <circle cx="23" cy="22" r="4.4" fill="#07090f"/>
    <circle cx="32" cy="31" r="4.4" fill="#07090f"/>
    <circle cx="41" cy="40" r="4.4" fill="#07090f" fill-opacity=".3"/>
  </g>
</svg>
